[project]
name = "arcade-tool-selector"
version = "0.1.0"
description = "Prompt-based tool selection and call vetting in front of Arcade"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "arcadepy>=1.10.0",
    "mcp>=2.3.0",
    "openai>=3.29.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
]

[project.scripts]
ats-proxy = "arcade_tool_selector.proxy.server:main"
ats-hook = "arcade_tool_selector.claude_code.hook:main"
ats-audit = "arcade_tool_selector.executions:main"

[project.optional-dependencies]
otel = [
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arcade_tool_selector"]

[dependency-groups]
dev = [
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
