# Demo project for `uv run ats-demo`: narrow purpose, broad gateway.
# {domain} is filled in with the domain of ARCADE_USER_ID, so "the user's team" is your own team.
project: meeting-scheduler
server_name: workspace-search
project_prompt: >
  Meeting scheduler. Reads the user's calendar, finds free time, and creates, moves or cancels events
  for the user and their team ({domain}), and only invites people at {domain}. Reads email only to find
  scheduling requests. It does not send email, share files, or use any other app.

scope:
  org_domains: ["{domain}"]
