# Project config for a workspace-search gateway (Gmail, Calendar, Drive, Linear, Slack).
# The gateway decides which tools exist; its instructions (Arcade dashboard) are the policy every call is judged against.
project: workspace-search
server_name: workspace-search            # must match the MCP server name in Claude Code

catalog:
  refresh_interval: 15m                   # poll the gateway's tools/list; 0 = startup only
  max_staleness: 24h

scope:                                    # judged per call against the gateway's instructions (PLAN §4.10)
  threshold: 0.85                         # both scope answers (purpose, requested) must reach this
  org_domains: [example.com]              # who counts as inside the organization
  protect_internal: false                 # true: calls that reach people must not reveal internal details

policy:
  approve: [destructive]                  # in-scope calls in these tiers still ask (Claude Code's prompt)
  on_low_scope:                           # what an out-of-scope judgment does, by the call's tier
    read: ask
    write: ask
    send: deny                            # writes the judge says reach people (email, chat, invites, shares)
    destructive: deny
