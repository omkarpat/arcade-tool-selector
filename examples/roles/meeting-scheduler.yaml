# Role: meeting scheduler. Arcade project "Meeting Scheduler".
# Gateway: Google Calendar + Gmail read + Gmail reply/draft-reply. No Linear tools exist on it at all.
project: meeting-scheduler
server_name: meeting-scheduler
project_prompt: >
  Meeting scheduler. Reads the user's calendar, finds free time, and creates, moves or cancels events. Reads
  email to find scheduling requests and replies only to emails about meetings. It does not send other email,
  share files, or use any other app.

scope:
  org_domains: [example.com]              # your organization's email domains

policy:
  args:
    GoogleCalendar_CreateEvent:
      attendee_emails: { domains: [example.com] }   # invites stay inside the organization
