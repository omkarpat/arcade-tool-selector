# Selection eval v0 for the workspace gateway (evals/catalogs/workspace.json).
#
# needs: one entry per thing the request requires; each entry lists the tools that would satisfy it
#        (any one counts). An empty list means the request needs no tool at all.
# ok:    tools that are reasonable to include (lookups, profiles) but not required; not counted against precision.
# tags:  hard-negative = look-alike tools must not be confused; multi = spans toolkits; none = no tool needed.

